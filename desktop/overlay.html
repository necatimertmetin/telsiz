<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>Telsiz konuşanlar</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font:500 15px system-ui,sans-serif;color:#d5d6d8;user-select:none}
  #list{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:4px}
  .u{display:flex;align-items:center;gap:8px;box-sizing:border-box;max-width:210px;padding:5px 12px 5px 10px;border-radius:999px;background:rgba(10,12,15,.68)}
  .u.talk{background:rgba(10,12,15,.92);color:#fff;font-weight:700}
  .u b{flex:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.28)}
  .u.talk b{background:#5ee07a}
  .u span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .u svg{flex:none}
</style>
<div id="list"></div>
<script>
  const list = document.getElementById('list')
  const MUTED = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff8a7d" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="mikrofon kapalı"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 11 5.7M12 18v3M4 4l16 16"/></svg>'
  window.telsizOverlay.onData(people => {
    list.replaceChildren(...people.map(p => {
      const row = document.createElement('div')
      row.className = 'u' + (p.talk ? ' talk' : '')
      const name = document.createElement('span')
      name.textContent = p.name
      row.append(document.createElement('b'), name)
      if (p.muted) row.insertAdjacentHTML('beforeend', MUTED)
      return row
    }))
  })
</script>
</html>
